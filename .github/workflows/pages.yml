# 화면(클라이언트)만 GitHub Pages에 올린다. 게임 서버는 Pages에서 돌 수 없으므로 따로 띄워야 한다 (README의 '파일럿 배포').
# 저장소 Settings > Pages > Source를 'GitHub Actions'로 두고,
# Settings > Secrets and variables > Actions > Variables에 SERVER_URL(예: wss://내-서버-주소)을 넣는다.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SERVER_URL: ${{ vars.SERVER_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
